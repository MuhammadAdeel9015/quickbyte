    function App(){
      const [category,setCategory]=useState("All"),[search,setSearch]=useState(""),[cart,setCart]=useState(()=>readSaved("quickbite-cart",[])),[drawer,setDrawer]=useState(false),[toast,setToast]=useState(""),[liked,setLiked]=useState(()=>readSaved("quickbite-favorites",[])),[orders,setOrders]=useState(()=>readSaved("quickbite-orders",[])),[user,setUser]=useState(()=>readSaved("quickbite-user",null)),[modal,setModal]=useState(""),[trackId,setTrackId]=useState(""),[trackedId,setTrackedId]=useState(""),[authMode,setAuthMode]=useState("login"),[authError,setAuthError]=useState(""),[checkoutError,setCheckoutError]=useState(""),[selected,setSelected]=useState(null),[showPassword,setShowPassword]=useState(false);
      const filtered=useMemo(()=>products.filter(p=>(category==="All"||(category==="Favorites"?liked.includes(p.id):p.cat===category))&&p.name.toLowerCase().includes(search.trim().toLowerCase())),[category,search,liked]);
      const count=cart.reduce((n,x)=>n+x["qty"],0),subtotal=cart.reduce((n,x)=>n+x.price*x["qty"],0),deliveryFee=subtotal===0||subtotal>=2000?0:150,total=subtotal+deliveryFee;
      const trackedOrder=orders.find(order=>order.id.toLowerCase()===trackedId.toLowerCase());
      useEffect(()=>{localStorage.setItem("quickbite-cart",JSON.stringify(cart))},[cart]);
      useEffect(()=>{localStorage.setItem("quickbite-favorites",JSON.stringify(liked))},[liked]);
      useEffect(()=>{localStorage.setItem("quickbite-orders",JSON.stringify(orders))},[orders]);
      useEffect(()=>{if(user)localStorage.setItem("quickbite-user",JSON.stringify(user));else localStorage.removeItem("quickbite-user")},[user]);
      useEffect(()=>{const onKey=e=>{if(e.key==="Escape"){setModal("");setDrawer(false)}};window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey)},[]);
      function notify(msg){setToast(msg);window.clearTimeout(notify.timer);notify.timer=window.setTimeout(()=>setToast(""),2600)}
      function add(p){setCart(old=>{const found=old.find(x=>x.id===p.id);return found?old.map(x=>x.id===p.id?{...x,qty:x["qty"]+1}:x):[...old,{...p,qty:1}]});notify(p.name+" added to your cart")}
      function change(id,delta){setCart(old=>old.map(x=>x.id===id?{...x,qty:x["qty"]+delta}:x).filter(x=>x["qty"]>0))}
      function toggleFavorite(id){setLiked(old=>old.includes(id)?old.filter(x=>x!==id):[...old,id])}
      function goMenu(){document.getElementById("menu").scrollIntoView({behavior:"smooth"})}
      function handleAuth(e){e.preventDefault();setAuthError("");const data=new FormData(e.currentTarget),name=String(data.get("name")||"").trim(),email=String(data.get("email")||"").trim().toLowerCase(),password=String(data.get("password")||"");if(authMode==="signup"){if(password!==data.get("confirmPassword")){setAuthError("Passwords do not match.");return}setUser({name,email});notify("Welcome to QuickBite, "+name+"!")}else{setUser({name:email.split("@")[0],email});notify("Signed in in demo mode.")}setModal("")}
      function placeOrder(e){e.preventDefault();setCheckoutError("");if(!cart.length){setCheckoutError("Your cart is empty. Add a dish before checking out.");return}const data=new FormData(e.currentTarget),id=`QB-${Date.now().toString().slice(-8)}-${Math.random().toString(36).slice(2,6).toUpperCase()}`,order={id,date:new Date().toISOString(),customer:{name:String(data.get("name")).trim(),phone:String(data.get("phone")).trim(),address:String(data.get("address")).trim()},items:cart.map(item=>({...item})),subtotal,deliveryFee,total,statusIndex:0};setOrders(old=>[order,...old]);setCart([]);setTrackedId(id);setTrackId(id);setModal("confirmation")}
      function advanceStatus(id){setOrders(old=>old.map(order=>order.id===id?{...order,statusIndex:Math.min(order.statusIndex+1,orderStages.length-1)}:order))}
      function openAuth(mode="login"){setAuthMode(mode);setAuthError("");setShowPassword(false);setModal("auth")}
      function imageFallback(e){e.currentTarget.onerror=null;e.currentTarget.src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'%3E%3Crect width='400' height='260' fill='%23edf4e9'/%3E%3Ctext x='50%25' y='52%25' dominant-baseline='middle' text-anchor='middle' font-size='64'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E"}
      return <React.Fragment>
        <div className="topbar">GOOD FOOD, GOOD MOOD <b>✦</b> Free delivery on orders above Rs. 2,000</div>
        <header><div className="wrap nav">
          <a className="brand" href="#"><span className="brandmark">Q</span>quick<em>bite.</em></a>
          <nav className="navlinks"><a href="#">Home</a><a href="#menu">Our Menu</a><a href="#story">Our Story</a><a href="#track">Track Order</a></nav>
          <div className="navright"><button className="login" onClick={()=>user?setModal("account"):openAuth()}>{user?"Account":"Sign in"}</button><button className="cartbtn" onClick={()=>setDrawer(true)}>Your cart <span>{count}</span></button></div>
        </div></header>
        <main>
          <section className="hero"><div className="wrap hero-grid">
            <div><div className="eyebrow"><span className="pulse"></span> Freshly made, always</div><h1>Good food.<br/>Great mood.<br/><span>Delivered.</span></h1><p>Cravings don't wait. Discover your new favourites, made fresh in our kitchen and brought straight to your door.</p><div className="hero-actions"><button className="primary" onClick={goMenu}>Explore our menu ↗</button><button className="secondary" onClick={()=>document.getElementById("story").scrollIntoView({behavior:"smooth"})}>Our story <span>→</span></button></div><div className="social-proof"><div className="avatars"><img onError={imageFallback} src="https://i.pravatar.cc/80?img=12" alt="Customer"/><img onError={imageFallback} src="https://i.pravatar.cc/80?img=32" alt="Customer"/><img onError={imageFallback} src="https://i.pravatar.cc/80?img=5" alt="Customer"/><img onError={imageFallback} src="https://i.pravatar.cc/80?img=44" alt="Customer"/></div><div><div className="stars">★★★★★</div><div className="prooftext"><b>Loved by foodies</b> · Freshness in every bite</div></div></div></div>
            <div className="hero-visual"><div className="hero-orbit"></div><img className="hero-photo" onError={imageFallback} src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1100&q=90" alt="Freshly prepared food spread"/><div className="float-card one"><span className="float-icon">🛵</span><strong>Quick delivery</strong><small>At your doorstep</small></div><div className="float-card two"><span className="float-icon">🥬</span><strong>Fresh ingredients</strong><small>Made with care daily</small></div></div>
          </div></section>
          <div className="benefits"><div className="wrap benefit-row"><div className="benefit"><i>🥗</i><div><b>Fresh ingredients</b><small>Quality you can taste</small></div></div><div className="benefit"><i>⚡</i><div><b>Fast preparation</b><small>Fresh, never rushed</small></div></div><div className="benefit"><i>🛵</i><div><b>Live order updates</b><small>Know where it is</small></div></div><div className="benefit"><i>♡</i><div><b>Made with love</b><small>Every single order</small></div></div></div></div>
          <section className="menu-section" id="menu"><div className="wrap"><div className="section-head"><div><div className="kicker">A little something for everyone</div><h2>Explore our menu</h2><p>Handpicked favourites, prepared fresh just for you.</p></div><label className="searchbox">⌕ <input aria-label="Search menu" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search your cravings..." /></label></div>
            <div className="filters">{categories.map(c=><button key={c} onClick={()=>setCategory(c)} className={"filter "+(category===c?"active":"")}>{c}{c==="Favorites"?` (${liked.length})`:""}</button>)}</div>
            <div className="products">{filtered.map((p,i)=><article className="product" key={p.id} style={{animationDelay:(i*.07)+"s"}}><div className="product-img" role="button" tabIndex="0" onClick={()=>{setSelected(p);setModal("details")}} onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setSelected(p);setModal("details")}}}><img onError={imageFallback} src={p.img} alt={p.name}/><span className="tag">{p.tag}</span></div><button className={"heart "+(liked.includes(p.id)?"liked":"")} onClick={()=>toggleFavorite(p.id)} aria-label={liked.includes(p.id)?"Remove from favourites":"Add to favourites"}>{liked.includes(p.id)?"♥":"♡"}</button>
              <div className="product-body"><div className="product-title"><button className="product-name" onClick={()=>{setSelected(p);setModal("details")}}>{p.name}</button><span className="rating">★ {p.rating}</span></div><p>{p.desc}</p><div className="product-foot"><div className="price">{money(p.price)} <small>/ item</small></div><button className="add" onClick={()=>add(p)} aria-label={"Add "+p.name}>+</button></div></div></article>)}</div>
            {filtered.length===0&&<p className="empty-results">{category==="Favorites"&&!search?"You haven’t saved any favourites yet. Tap the heart on a dish to save it.":"No dishes found. Try another search or category."}</p>}
          </div></section>
          <section className="story" id="story"><div className="wrap story-grid"><div><div className="kicker" style={{color:"#d8f36a"}}>More than just a meal</div><h2>Good food brings people together.</h2><p>At QuickBite, we believe every meal deserves a little extra care. From carefully selected ingredients to the final delivery, we're here to make your everyday food moments special.</p><div className="story-points"><div><b>100%</b><small>Freshly prepared</small></div><div><b>Made</b><small>With real care</small></div><div><b>Everyday</b><small>For your cravings</small></div></div></div><img className="story-img" onError={imageFallback} src="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=1000&q=85" alt="Warm cafe dining experience"/></div></section>
          <section className="tracking" id="track"><div className="wrap"><div className="track-card"><div><div className="kicker">Your food is on its way</div><h2>Track your order</h2><p>Enter an order ID from your confirmation or order history.</p></div><form className="track-form" onSubmit={e=>{e.preventDefault();setTrackedId(trackId.trim());if(!orders.some(order=>order.id.toLowerCase()===trackId.trim().toLowerCase()))notify("We couldn’t find that demo order ID.")}}><input aria-label="Demo order ID" value={trackId} onChange={e=>setTrackId(e.target.value)} placeholder="e.g. QB-10245" required/><button>Track order →</button></form></div>
            {trackedId&&<div className="track-result" aria-live="polite">{trackedOrder?<><div className="track-result-head"><div><b>Order {trackedOrder.id}</b><small>{trackedOrder.customer.name} · {new Date(trackedOrder.date).toLocaleString()}</small></div><strong>{orderStages[trackedOrder.statusIndex]}</strong></div><div className="progress-steps">{orderStages.map((stage,index)=><span key={stage} className={index<=trackedOrder.statusIndex?"complete":""}>{stage}</span>)}</div><p>{trackedOrder.items.map(item=>`${item.name} × ${item["qty"]}`).join(" · ")} · Total {money(trackedOrder.total)}</p><button className="filter" disabled={trackedOrder.statusIndex>=orderStages.length-1} onClick={()=>advanceStatus(trackedOrder.id)}>{trackedOrder.statusIndex>=orderStages.length-1?"Order delivered":"Advance demo status →"}</button></>:<p className="track-error">No demo order found with that ID. Check it in your order confirmation or order history.</p>}</div>}
          </div></section>
        </main>
        <footer><div className="wrap"><div className="footer-grid"><div className="footer-brand"><a className="brand" href="#" style={{color:"white"}}><span className="brandmark">Q</span>quick<em>bite.</em></a><p>Fresh flavours, happy moments. Your neighbourhood café experience, made easier.</p></div><div className="footer-col"><b>Explore</b><a href="#menu">Our menu</a><a href="#story">Our story</a><a href="#track">Track order</a></div><div className="footer-col"><b>Quick links</b><a href="#account" onClick={e=>{e.preventDefault();user?setModal("account"):openAuth()}}>{user?"My account":"Sign in / Register"}</a><a href="#menu" onClick={()=>setCategory("Favorites")}>Favorites</a><a href="#menu">Popular dishes</a></div><div className="footer-col"><b>Opening hours</b><a>Monday – Sunday</a><a>11:00 AM – 11:00 PM</a><a>Freshly made, daily</a></div></div><div className="copyright"><span>© 2026 QuickBite. All rights reserved.</span><span>Made for good food moments ✦</span></div></div></footer>
        <div className={"overlay "+(drawer?"show":"")} onClick={()=>setDrawer(false)}></div>
        <aside className={"drawer "+(drawer?"show":"")} aria-label="Shopping cart"><div className="drawer-head"><h3>Your cart ({count})</h3><button className="close" aria-label="Close cart" onClick={()=>setDrawer(false)}>×</button></div><div className="cart-items">{cart.length===0?<div className="empty"><div style={{fontSize:42,marginBottom:10}}>🛍️</div>Your cart is looking a little hungry.<br/>Add something delicious!</div>:cart.map(x=><div className="cart-item" key={x.id}><img onError={imageFallback} src={x.img} alt={x.name}/><div className="cart-item-info"><b>{x.name}</b><small>{money(x.price)} each</small><div className="qty"><button aria-label={`Decrease ${x.name}`} onClick={()=>change(x.id,-1)}>−</button><span>{x["qty"]}</span><button aria-label={`Increase ${x.name}`} onClick={()=>change(x.id,1)}>+</button></div><button className="remove-item" onClick={()=>setCart(old=>old.filter(item=>item.id!==x.id))}>Remove</button></div><b style={{fontSize:12}}>{money(x.price*x["qty"])}</b></div>)}</div><div className="cart-bottom"><div className="total"><span>Subtotal</span><span>{money(subtotal)}</span></div><div className="total"><span>Delivery</span><span>{deliveryFee?money(deliveryFee):"Free"}</span></div><div className="total"><span>Total</span><span>{money(total)}</span></div><button className="primary checkout" disabled={!cart.length} onClick={()=>{if(!cart.length)return;setCheckoutError("");setDrawer(false);setModal("checkout")}}>Continue to checkout →</button><p style={{fontSize:10,color:"#89938c",textAlign:"center"}}>Free delivery on orders above Rs. 2,000.</p></div></aside>
        <div className={"modalback "+(modal?"show":"")} onClick={()=>setModal("")}><div className="modal" role="dialog" aria-modal="true" onClick={e=>e.stopPropagation()}><button className="modal-close" aria-label="Close dialog" onClick={()=>setModal("")}>×</button>
          {modal==="auth"&&<><h3>{authMode==="login"?"Welcome back!":"Create your account"}</h3><p>{authMode==="login"?"Sign in to view your orders and save your favourites.":"Join QuickBite to keep your demo orders and favourites together."}</p><form className="dialog-form" onSubmit={handleAuth}>{authMode==="signup"&&<input name="name" placeholder="Full name" autoComplete="name" required minLength="2"/>}<input name="email" placeholder="Email address" type="email" autoComplete="email" required/><input name="password" placeholder="Password (at least 6 characters)" type={showPassword?"text":"password"} autoComplete={authMode==="login"?"current-password":"new-password"} required minLength="6"/><button className="text-action" type="button" aria-pressed={showPassword} onClick={()=>setShowPassword(value=>!value)}>{showPassword?"Hide password":"Show password"}</button>{authMode==="signup"&&<input name="confirmPassword" placeholder="Confirm password" type={showPassword?"text":"password"} required minLength="6"/>}{authError&&<p className="form-error" role="alert">{authError}</p>}<button className="primary" type="submit">{authMode==="login"?"Sign in":"Create account"}</button></form><p className="form-note">Frontend demo only — no password or account data is sent to a server.</p><button className="text-action" onClick={()=>{setAuthMode(authMode==="login"?"signup":"login");setAuthError("");setShowPassword(false)}}>{authMode==="login"?"New to QuickBite? Create an account":"Already registered? Sign in"}</button></>}
          {modal==="checkout"&&<><h3>Almost there!</h3><p>Add your delivery details and review your order.</p>{cart.length===0?<div className="empty-checkout"><p>Your cart is empty. Add something delicious before checkout.</p><button className="primary" onClick={()=>{setModal("");goMenu()}}>Explore menu</button></div>:<><div className="order-summary"><b>Order summary</b>{cart.map(item=><div key={item.id}><span>{item.name} × {item["qty"]}</span><span>{money(item.price*item["qty"])}</span></div>)}<div><span>Subtotal</span><span>{money(subtotal)}</span></div><div><span>Delivery</span><span>{deliveryFee?money(deliveryFee):"Free"}</span></div><div className="summary-total"><b>Total</b><b>{money(total)}</b></div></div><form className="dialog-form" onSubmit={placeOrder}><input name="name" placeholder="Full name" autoComplete="name" required minLength="2" defaultValue={user?.name||""}/><input name="phone" placeholder="Phone number" type="tel" autoComplete="tel" required pattern="\+?[0-9]{7,15}" title="Enter 7–15 digits, optionally prefixed with +."/><textarea name="address" placeholder="Delivery address" autoComplete="street-address" required minLength="8" rows="3"/>{checkoutError&&<p className="form-error" role="alert">{checkoutError}</p>}<button className="primary" type="submit">Place demo order · {money(total)}</button></form><p className="form-note">Demo checkout only: no payment or real order is submitted.</p></>}</>}
          {modal==="details"&&selected&&<><img className="detail-image" onError={imageFallback} src={selected.img} alt={selected.name}/><span className="kicker">{selected.cat} · {selected.tag}</span><h3>{selected.name}</h3><p>{selected.desc}</p><p className="detail-rating">★ {selected.rating} · Freshly prepared to order</p><div className="detail-actions"><b>{money(selected.price)}</b><button className="primary" onClick={()=>{add(selected);setModal("")}}>Add to cart +</button><button className="filter" onClick={()=>toggleFavorite(selected.id)}>{liked.includes(selected.id)?"♥ Saved":"♡ Save favorite"}</button></div></>}
          {modal==="confirmation"&&orders[0]&&<><div className="confirmation-icon">✓</div><h3>Order placed!</h3><p>Your demo order has been saved on this device.</p><div className="confirmation-id"><small>Demo order ID</small><b>{orders[0].id}</b></div><p>{orders[0].items.map(item=>`${item.name} × ${item["qty"]}`).join(" · ")}<br/>Total: <b>{money(orders[0].total)}</b></p><div className="detail-actions"><button className="primary" onClick={()=>{setModal("");document.getElementById("track").scrollIntoView({behavior:"smooth"})}}>Track order</button><button className="filter" onClick={()=>setModal("account")}>Order history</button></div></>}
          {modal==="account"&&<><h3>My account</h3>{user?<p>Signed in as <b>{user.name}</b><br/><small>{user.email}</small></p>:<p>Local demo order history saved on this device.</p>}
            <div className="account-stats"><span>{orders.length} demo order{orders.length===1?"":"s"}</span><span>{liked.length} favorite{liked.length===1?"":"s"}</span></div>
            <h4 className="history-title">Order history</h4>{orders.length===0?<p className="history-empty">No demo orders yet. Your completed checkouts will appear here.</p>:<div className="history-list">{orders.map(order=><article className="history-order" key={order.id}><div className="history-order-head"><b>{order.id}</b><span>{orderStages[order.statusIndex]}</span></div><small>{new Date(order.date).toLocaleString()}</small><p>{order.items.map(item=>`${item.name} × ${item["qty"]}`).join(" · ")}<br/>Total: <b>{money(order.total)}</b></p><div className="history-total"><span>Total</span><b>{money(order.total)}</b></div><button className="text-action" onClick={()=>{setTrackId(order.id);setTrackedId(order.id);setModal("");document.getElementById("track").scrollIntoView({behavior:"smooth"})}}>Track this order →</button></article>)}</div>}
            <div className="detail-actions"><button className="filter" onClick={()=>{setModal("");setCategory("Favorites");goMenu()}}>View favorites</button>{user&&<button className="text-action" onClick={()=>{setUser(null);setModal("");notify("You’ve signed out.")}}>Sign out</button>}</div></>}
        </div></div>
        <div className={"toast "+(toast?"show":"")} role="status">{toast}</div>
      </React.Fragment>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
